<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Close Assistant for Unimicro</title>
<meta name="description" content="Month-end close without detective work: smarter dunning, a cash forecast you can trust, and a revision check that explains itself. Unimicro Hackathon 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Gurmukhi:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette and type follow unimicro.no: ink #092329, blue #133EE2, lime #D0F59E, warm off-white, Anek Gurmukhi headings, Inter body. */
  :root {
    color-scheme: light dark;
    --ink: #092329; --ink-2: #0e2e35; --lime: #d0f59e;
    --bg: #f7f6f3; --card: #ffffff; --text: #092329; --muted: #5d6f78; --border: #d9e1e6;
    --blue: #133ee2; --blue-soft: #e8edfd; --red: #c7231b; --red-soft: #fff2f1; --amber: #d97706; --amber-soft: #fff7e7;
    --green: #2f9e5a; --green-soft: #f1fef5; --header: #eef2f5;
    --hero-bg: #092329; --hero-text: #ffffff; --hero-muted: #b9c8cf; --hero-border: rgba(255,255,255,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #071b20; --card: #0e2e35; --text: #f1ece5; --muted: #a9b8c0; --border: #1f444d;
      --blue: #8fb0ff; --blue-soft: #14305c; --red: #ff8a82; --red-soft: #3a1b19; --amber: #f0a13a; --amber-soft: #3a2b10;
      --green: #6fd08d; --green-soft: #16301f; --header: #123840;
      --hero-bg: #0e2e35; --hero-border: rgba(255,255,255,.18);
    }
  }
  :root[data-theme="dark"] {
    --bg: #071b20; --card: #0e2e35; --text: #f1ece5; --muted: #a9b8c0; --border: #1f444d;
    --blue: #8fb0ff; --blue-soft: #14305c; --red: #ff8a82; --red-soft: #3a1b19; --amber: #f0a13a; --amber-soft: #3a2b10;
    --green: #6fd08d; --green-soft: #16301f; --header: #123840;
    --hero-bg: #0e2e35; --hero-border: rgba(255,255,255,.18);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 Inter, "Segoe UI", system-ui, sans-serif; }
  a { color: var(--blue); }
  h1, h2, h3 { font-family: "Anek Gurmukhi", Inter, "Segoe UI", system-ui, sans-serif; font-weight: 500; letter-spacing: -.01em; }
  header.hero { padding: 4rem 1.5rem 3rem; text-align: center; background: var(--hero-bg); color: var(--hero-text); position: relative; }
  .hero .kicker { display: inline-block; background: var(--lime); color: var(--ink); font-weight: 600; font-size: .8rem; letter-spacing: .02em; padding: .3rem .8rem; border-radius: 99px; margin-bottom: 1.1rem; }
  .hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.05; margin: 0 0 .75rem; }
  .hero p.lead { font-size: 1.15rem; color: var(--hero-muted); max-width: 44rem; margin: 0 auto 1.5rem; }
  .hero .cta { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  .hero .btn { border-color: var(--hero-border); color: var(--hero-text); background: transparent; }
  .hero .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .hero .byline { color: var(--hero-muted); margin-top: 1.5rem; font-size: .9rem; }
  .btn { display: inline-block; padding: .65rem 1.2rem; border-radius: 99px; border: 1px solid var(--border); text-decoration: none; color: var(--text); background: var(--card); font-weight: 500; cursor: pointer; font: inherit; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .lang { position: absolute; top: 16px; right: 18px; display: inline-flex; border: 1px solid var(--hero-border); border-radius: 99px; overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--hero-muted); padding: .35rem .8rem; cursor: pointer; font: inherit; font-size: .85rem; font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--lime); color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  section { margin: 3rem 0; }
  h2 { font-size: 1.75rem; margin: 0 0 .25rem; }
  h3 { font-size: 1.15rem; margin: 0 0 .5rem; }
  p.sub { color: var(--muted); margin: 0 0 1rem; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .two { display: grid; gap: 1rem; grid-template-columns: minmax(260px, 1fr) minmax(0, 1.7fr); margin-top: 1rem; }
  @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.15rem; min-width: 0; }
  .kpis { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .kpi .label { color: var(--muted); font-size: .85rem; }
  .kpi .value { font-size: 1.45rem; font-weight: 600; margin: .15rem 0; white-space: nowrap; }
  .kpi .note { color: var(--muted); font-size: .8rem; }
  .red { color: var(--red); } .amber { color: var(--amber); } .green { color: var(--green); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { background: var(--header); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.tagcell { white-space: nowrap; }
  .tag { display: inline-block; padding: .1rem .55rem; border-radius: 99px; font-size: .78rem; border: 1px solid var(--border); white-space: nowrap; }
  .tag.critical { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .tag.warning { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
  .tag.success { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .tag.info { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--header); margin: .5rem 0 1rem; }
  .bar div { height: 100%; }
  details { border: 1px solid var(--border); border-radius: 8px; padding: .5rem .85rem; margin: .5rem 0; background: var(--card); }
  summary { cursor: pointer; font-weight: 500; }
  details p, details ul { margin: .5rem 0; font-size: .92rem; }
  pre { white-space: pre-wrap; font: inherit; font-size: .9rem; background: var(--header); padding: .75rem; border-radius: 8px; }
  .problems { counter-reset: p; }
  .problems .card { position: relative; padding-top: 1.1rem; }
  .problems h3::before { counter-increment: p; content: counter(p) ". "; color: var(--blue); }
  .wide { grid-column: 1 / -1; }
  footer { color: var(--muted); font-size: .85rem; text-align: center; padding: 2rem 1rem 3rem; border-top: 1px solid var(--border); }
  .toggle { position: fixed; right: 16px; bottom: 16px; }
  .shots { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .shots figure, figure.shot { margin: 0; }
  .shots img, figure.shot img { width: 100%; border: 1px solid var(--border); border-radius: 8px; display: block; cursor: zoom-in; }
  .shots figcaption, figure.shot figcaption { font-size: .85rem; color: var(--muted); margin-top: .35rem; }
  figure.shot + figure.shot { margin-top: 1rem; }
  .video { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 10px; background: var(--header); }
  .muted { color: var(--muted); }
  /* lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(8, 10, 12, .92); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 1000; padding: 2rem; cursor: zoom-out; }
  .lightbox[open] { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 6rem); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .lightbox figcaption { color: #e8eaed; margin-top: .75rem; font-size: .95rem; text-align: center; }
  .lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); color: #fff; border: 0; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; }
  .lightbox .prev { left: 16px; } .lightbox .next { right: 16px; }
  .lightbox .close { position: absolute; top: 14px; right: 18px; background: transparent; border: 0; color: #fff; font-size: 1.8rem; cursor: pointer; }
  @media (max-width: 700px) { .kpi .value { font-size: 1.2rem; } .lang { position: static; margin-bottom: 1rem; } }
</style>
</head>
<body>
<header class="hero">
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="nb">NO</button><button type="button" data-lang="en">EN</button></div>
  <span class="kicker">Unimicro Hackathon 2026</span>
  <h1>Close Assistant for Unimicro</h1>
  <p class="lead" data-i18n="lead"></p>
  <div class="cta">

    <a class="btn" href="#dark" data-i18n="ctaDark"></a>

  <p class="byline" data-i18n="byline"></p>
</header>

<main>
  <section>
    <h2 data-i18n="p.h"></h2>
    <p class="sub" data-i18n="p.sub"></p>
    <div class="grid problems">
      <div class="card"><h3 data-i18n="p1.h"></h3><p data-i18n-html="p1.t"></p></div>
      <div class="card"><h3 data-i18n="p2.h"></h3><p data-i18n="p2.t"></p></div>
      <div class="card"><h3 data-i18n="p3.h"></h3><p data-i18n="p3.t"></p></div>
    </div>
  </section>

  <section id="where">
    <h2 data-i18n="w.h"></h2>
    <p class="sub" data-i18n="w.sub"></p>
    <div class="shots" id="shots"></div>
  </section>

  <section id="demo">
    <h2 data-i18n="d.h"></h2>
    <p class="sub" id="captured"></p>
    <div class="kpis" id="kpis"></div>
    <div class="two">
      <div class="card">
        <h3 data-i18n="d.aging"></h3>
        <div class="bar" id="agebar"></div>
        <table id="agetable"></table>
        <p class="sub" id="agenote" style="margin-top:.75rem"></p>
      </div>
      <div class="card">
        <h3 data-i18n="d.chase"></h3>
        <div class="scroll"><table id="chase"></table></div>
      </div>
    </div>
    <div class="grid" style="margin-top:1rem">
      <div class="card wide">
        <h3 data-i18n="d.rev"></h3>
        <p class="sub" id="revsum"></p>
        <div id="revision"></div>
      </div>
      <div class="card wide">
        <h3 data-i18n="d.fc"></h3>
        <div class="scroll"><table id="forecast"></table></div>
        <details id="assumptions"><summary data-i18n="d.assume"></summary><ul></ul></details>
      </div>
      <div class="card wide">
        <h3 data-i18n="d.rem"></h3>
        <p class="sub" data-i18n="d.remsub"></p>
        <div id="reminder"></div>
      </div>
    </div>
  </section>

  <section id="video">
    <h2>Video</h2>
    <p class="sub" data-i18n="v.sub"></p>
    <div id="videobox"><p class="muted" data-i18n="v.pending"></p></div>
  </section>

  <section id="dark">
    <h2 data-i18n="k.h"></h2>
    <div class="grid">
      <div class="card">
        <p data-i18n="k.t1"></p>
        <p><a href="https://github.com/Jean-Nicolas-Gilles-Hopfer/unimicro-close-assistant/tree/main/theme" data-i18n="k.link"></a> · <span data-i18n="k.t2"></span></p>
      </div>
      <div class="card" id="darkshot"><p class="muted" data-i18n="k.pending"></p></div>
    </div>
  </section>

  <section id="how">
    <h2 data-i18n="h.h"></h2>
    <div class="grid">
      <div class="card"><h3>Plugin</h3><p data-i18n-html="h.plugin"></p></div>
      <div class="card"><h3 data-i18n="h.domain.h"></h3><p data-i18n="h.domain"></p></div>
      <div class="card"><h3 data-i18n="h.mcp.h"></h3><p data-i18n="h.mcp"></p></div>
    </div>
  </section>
</main>

<footer>Close Assistant · Unimicro Hackathon 2026 · <a href="https://github.com/Jean-Nicolas-Gilles-Hopfer/unimicro-close-assistant">GitHub</a></footer>

</div>

    thAge: { nb: 'Alder', en: 'Age' }, thAmount: { nb: 'Beløp', en: 'Amount' }, thCustomer: { nb: 'Kunde', en: 'Customer' }, thNet: { nb: 'Reelt forfalt', en: 'Really overdue' },
    thOldest: { nb: 'Eldste', en: 'Oldest' }, thStep: { nb: 'Neste steg', en: 'Next step' }, days: { nb: 'd', en: 'd' },
    ageNote: { nb: (g, n) => `Brutto ${g}. Etter matching av innbetalinger er ${n} reelt forfalt.`, en: (g, n) => `Gross ${g}. After matching payments, ${n} is really overdue.` },
    revSum: { nb: (e, w, y) => `${e} feil, ${w} ${w === 1 ? 'advarsel' : 'advarsler'} for ${y}. Rekkefølgen er valgt slik at rotårsaken kommer først.`, en: (e, w, y) => `${e} ${e === 1 ? 'error' : 'errors'}, ${w} ${w === 1 ? 'warning' : 'warnings'} for ${y}. Ordered so the root cause comes first.` },
    sevError: { nb: 'Feil', en: 'Error' }, sevWarn: { nb: 'Advarsel', en: 'Warning' }, sevInfo: { nb: 'Info', en: 'Info' },
    causes: { nb: 'Sannsynlige årsaker', en: 'Likely causes' }, check: { nb: 'Slik sjekker du', en: 'How to check' }, proposal: { nb: 'Forslag', en: 'Proposal' },
    thAccount: { nb: 'Konto', en: 'Account' }, thText: { nb: 'Tekst', en: 'Text' }, thDate: { nb: 'Dato', en: 'Date' },
    fcWeek: { nb: 'Uke fra', en: 'Week of' }, fcIn: { nb: 'Inn (kunder)', en: 'In (customers)' }, fcOut: { nb: 'Ut (leverandører)', en: 'Out (suppliers)' }, fcFixed: { nb: 'Faste kostnader', en: 'Fixed costs' }, fcBal: { nb: 'Saldo', en: 'Balance' },
    fcExtra: { nb: 'Innbetalinger som ikke er koblet til faktura er trukket fra de eldste fakturaene først.', en: 'Payments not matched to an invoice are deducted from the oldest invoices first.' },
    remLine: { nb: 'reelt forfalt', en: 'really overdue' }, remTemplate: { nb: '(mal)', en: '(template)' },
    captured: { nb: (c, t) => `Øyeblikksbilde fra ${c}, hentet ${t}.`, en: (c, t) => `Snapshot from ${c}, captured ${t}.` },
    loadFail: { nb: 'Kunne ikke laste øyeblikksbildet.', en: 'Could not load the snapshot.' },
    themeDark: { nb: '☾ Mørk', en: '☾ Dark' }, themeLight: { nb: '☀ Lys', en: '☀ Light' },
  };
  const STEP = { none: { nb: 'Ikke forfalt', en: 'Not due', cls: 'success' }, friendly_reminder: { nb: 'Vennlig påminnelse', en: 'Friendly reminder', cls: 'info' }, reminder_with_fee: { nb: 'Purring', en: 'Reminder with fee', cls: 'warning' }, debt_collection_notice: { nb: 'Inkassovarsel', en: 'Collection notice', cls: 'critical' }, send_to_collection: { nb: 'Til inkasso', en: 'Send to collection', cls: 'critical' } };
  const SECTION = { 'Opening balance total': { nb: 'Åpningsbalansen går ikke i null', en: 'Opening balance does not net to zero' }, 'Income statement opening balance': { nb: 'Resultatkontoer har inngående balanse', en: 'Income statement accounts carry an opening balance' }, 'Receivables': { nb: 'Kundefordringer avviker fra reskontro', en: 'Receivables differ from the sub-ledger' }, 'Liability accounts': { nb: 'Gjeldskonto med debetsaldo', en: 'Liability account with a debit balance' }, 'Unmatched customer payments': { nb: 'Umatchede innbetalinger fra kunder', en: 'Unmatched customer payments' }, 'VAT returns': { nb: 'Mva-melding ikke levert', en: 'VAT return not filed' } };
  const BUCKET = { notDue: { nb: 'Ikke forfalt', en: 'Not due', c: '#50b46f' }, d1_30: { nb: '1–30 dager', en: '1–30 days', c: '#9ccc3a' }, d31_60: { nb: '31–60 dager', en: '31–60 days', c: '#eb830a' }, d61_90: { nb: '61–90 dager', en: '61–90 days', c: '#f26a2a' }, d90plus: { nb: 'Over 90 dager', en: 'Over 90 days', c: '#c7231b' } };
  const SHOTS = [
    ['img/overview.png', { nb: 'Oversiktssiden under Salg', en: 'The overview page under Sales' }], ['img/widget.png', { nb: 'Widget på dashbordet', en: 'Dashboard widget' }],
    ['img/invoice-header.png', { nb: 'Merkelapp på fakturaen', en: 'Tag on the invoice' }], ['img/customer-header.png', { nb: 'Merkelapp på kunden', en: 'Tag on the customer' }],
    ['img/invoice-list.png', { nb: 'Kolonne i fakturalisten', en: 'Column in the invoice list' }], ['img/reminder.png', { nb: 'Purretekst på ett klikk', en: 'Reminder letter in one click' }],
  ];
  // The forecast assumptions come from the engine in English; Norwegian is derived from the same templates.
  const ASSUME_NB = [
    [/^Receivables not yet due: (\d+)% collected in their due week\.$/, (m) => `Kundefordringer som ikke er forfalt: ${m[1]} % innbetalt i forfallsuken.`],
    [/^Receivables 1-60 days overdue: (\d+)% collected within (\d+) weeks\.$/, (m) => `Kundefordringer 1–60 dager forfalt: ${m[1]} % innbetalt innen ${m[2]} uker.`],
    [/^Receivables more than 60 days overdue: (\d+)% collected in week (\d+), rest excluded\.$/, (m) => `Kundefordringer forfalt mer enn 60 dager: ${m[1]} % innbetalt i uke ${m[2]}, resten utelatt.`],
    [/^Supplier invoices paid in their due week; overdue ones in week (\d+)\.$/, (m) => `Leverandørfakturaer betales i forfallsuken; forfalte i uke ${m[1]}.`],
    [/^Fixed costs ([\d.]+)\/month spread evenly per week\.$/, (m) => `Faste kostnader ${new Intl.NumberFormat('nb-NO', { maximumFractionDigits: 2 }).format(Number(m[1]))} kr/måned fordelt likt per uke.`],
  ];

  // ---- language -------------------------------------------------------------------------------------
  let lang = 'nb';
  const qs = new URLSearchParams(location.search).get('lang');
  if (qs === 'en' || qs === 'nb') lang = qs;
  else { let s = ''; try { s = localStorage.getItem('lang') || ''; } catch {} lang = s || (/^(nb|no|nn)/i.test(navigator.language) ? 'nb' : 'en'); }
  const t = (k, ...a) => { const v = T[k]?.[lang]; return typeof v === 'function' ? v(...a) : (v ?? k); };
  const nok = (n) => new Intl.NumberFormat(lang === 'nb' ? 'nb-NO' : 'en-GB', { style: 'currency', currency: 'NOK', maximumFractionDigits: 0 }).format(n);
  const applyStatic = () => {
    document.documentElement.lang = lang === 'nb' ? 'no' : 'en';
    for (const n of document.querySelectorAll('[data-i18n]')) n.textContent = t(n.dataset.i18n);
    for (const n of document.querySelectorAll('[data-i18n-html]')) n.innerHTML = t(n.dataset.i18nHtml);
    for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  };
  for (const b of document.querySelectorAll('.lang button')) b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {} render(); };

  // ---- theme ---------------------------------------------------------------------------------------
  const root = document.documentElement, tb = el('themeToggle');
  const isDark = () => root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const setTheme = (th) => { if (th) root.setAttribute('data-theme', th); else root.removeAttribute('data-theme'); tb.textContent = isDark() ? t('themeLight') : t('themeDark'); try { localStorage.setItem('theme', th || ''); } catch {} };
  let savedTheme = ''; try { savedTheme = localStorage.getItem('theme') || ''; } catch {}
  tb.onclick = () => setTheme(isDark() ? 'light' : 'dark');

  // ---- lightbox ------------------------------------------------------------------------------------
  const gallery = []; // [src, captionKeyOrObj]
  const lb = el('lightbox'), lbImg = lb.querySelector('img'), lbCap = lb.querySelector('figcaption');
  let lbIndex = 0;
  const showLb = (i) => { lbIndex = (i + gallery.length) % gallery.length; const [src, cap] = gallery[lbIndex]; lbImg.src = src; lbImg.alt = cap[lang]; lbCap.textContent = cap[lang]; lb.setAttribute('open', ''); document.body.style.overflow = 'hidden'; };
  const hideLb = () => { lb.removeAttribute('open'); document.body.style.overflow = ''; };
  lb.onclick = (e) => { if (e.target === lb || e.target.classList.contains('close')) hideLb(); };
  lb.querySelector('.prev').onclick = (e) => { e.stopPropagation(); showLb(lbIndex - 1); };
  lb.querySelector('.next').onclick = (e) => { e.stopPropagation(); showLb(lbIndex + 1); };
  document.addEventListener('keydown', (e) => { if (!lb.hasAttribute('open')) return; if (e.key === 'Escape') hideLb(); if (e.key === 'ArrowLeft') showLb(lbIndex - 1); if (e.key === 'ArrowRight') showLb(lbIndex + 1); });
  const figure = (src, cap, cls = '') => { const f = document.createElement('figure'); f.className = cls; const idx = gallery.push([src, cap]) - 1; f.innerHTML = `<img src="${src}" alt="${esc(cap[lang])}"><figcaption>${esc(cap[lang])}</figcaption>`; f.querySelector('img').onclick = () => showLb(idx); f.dataset.idx = idx; return f; };
  const loaded = {};
  const shotsReady = SHOTS.map(([src, cap]) => new Promise((res) => { const im = new Image(); im.onload = () => { loaded[src] = true; res(); }; im.onerror = () => res(); im.src = src; }));
  const darkReady = ['img/dark-mode.png', 'img/dark-mode-dashboard.png'].map((src) => new Promise((res) => { const im = new Image(); im.onload = () => { loaded[src] = true; res(); }; im.onerror = () => res(); im.src = src; }));

  // ---- data ------------------------------------------------------------------------------------------
  let d = null;
  try { d = await (await fetch('data/snapshot.json')).json(); } catch {}
  await Promise.all([...shotsReady, ...darkReady]);

  function render() {
    applyStatic();
    setTheme(savedTheme = root.getAttribute('data-theme') || savedTheme);
    gallery.length = 0;
    el('shots').innerHTML = '';
    for (const [src, cap] of SHOTS) if (loaded[src]) el('shots').appendChild(figure(src, cap));
    if (loaded['img/dark-mode.png']) {
      el('darkshot').innerHTML = '';
      el('darkshot').appendChild(figure('img/dark-mode.png', { nb: T['k.cap1'].nb, en: T['k.cap1'].en }, 'shot'));
      if (loaded['img/dark-mode-dashboard.png']) el('darkshot').appendChild(figure('img/dark-mode-dashboard.png', { nb: T['k.cap2'].nb, en: T['k.cap2'].en }, 'shot'));
    }
    if (!d) { el('kpis').innerHTML = `<p class="muted">${t('loadFail')}</p>`; return; }

    const a = d.aging, f = d.forecast, r = d.revision;
    el('captured').textContent = t('captured', d.company, new Date(d.capturedAt).toLocaleString(lang === 'nb' ? 'nb-NO' : 'en-GB'));
    const bank = f.inputs.bankAccounts.reduce((s, x) => s + x.balance, 0);
    const chase = a.toChaseCount ?? a.counterparts.filter((c) => c.netOverdue > 0).length;
    el('kpis').innerHTML = [
      [t('kBank'), nok(bank), t('kAcc') + ' ' + f.inputs.bankAccounts.map((x) => x.accountNumber).join(', '), ''],
      [t('kAR'), nok(a.netTotal), t('kARnote', a.invoiceCount, nok(a.total), nok(-a.credits)), ''],
      [t('kOverdue'), nok(a.netOverdue), t('kChase', chase, a.customerCount), 'red'],
      [t('kCredits'), nok(-a.credits), t('kOverpaid', a.overpaidCount), 'amber'],
      [t('kLow'), nok(f.lowestClosing.amount), t('kWeek') + ' ' + f.lowestClosing.weekStart, f.lowestClosing.amount < 0 ? 'red' : ''],
    ].map(([l, v, n, c]) => `<div class="card kpi"><div class="label">${l}</div><div class="value ${c}">${v}</div><div class="note">${n}</div></div>`).join('');

    const total = Object.values(a.buckets).reduce((s, x) => s + x, 0);
    el('agebar').innerHTML = Object.entries(a.buckets).filter(([, v]) => v > 0).map(([k, v]) => `<div style="flex:${v};background:${BUCKET[k].c}" title="${BUCKET[k][lang]}: ${nok(v)}"></div>`).join('');
    el('agetable').innerHTML = `<tr><th>${t('thAge')}</th><th class="num">${t('thAmount')}</th></tr>` + Object.entries(a.buckets).map(([k, v]) => `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${BUCKET[k].c};margin-right:.5rem"></span>${BUCKET[k][lang]}</td><td class="num">${nok(v)}</td></tr>`).join('');
    el('agenote').textContent = t('ageNote', nok(total), nok(a.netOverdue));

    el('chase').innerHTML = `<tr><th>${t('thCustomer')}</th><th class="num">${t('thNet')}</th><th class="num">${t('thOldest')}</th><th>${t('thStep')}</th></tr>` +
      a.counterparts.filter((c) => c.netOverdue > 0).slice(0, 8).map((c) => { const s = STEP[c.suggestedStep.step]; return `<tr><td>${esc(c.counterpartName)}</td><td class="num">${nok(c.netOverdue)}</td><td class="num">${c.oldestDaysOverdue} ${t('days')}</td><td class="tagcell"><span class="tag ${s.cls}">${s[lang]}</span></td></tr>`; }).join('');

    const rems = lang === 'nb' && r.remediationsNb ? r.remediationsNb : r.remediations;
    el('revsum').textContent = t('revSum', r.errorCount, r.warningCount, r.year);
    el('revision').innerHTML = rems.map((m) => {
      const sev = m.severity === 'error' ? [t('sevError'), 'critical'] : m.severity === 'warning' ? [t('sevWarn'), 'warning'] : [t('sevInfo'), 'info'];
      const entries = m.proposedEntries.map((e) => `<p><strong>${t('proposal')}: ${esc(e.title)}</strong></p>` + (e.lines.length ? `<div class="scroll"><table><tr><th>${t('thAccount')}</th><th class="num">${t('thAmount')}</th><th>${t('thText')}</th><th>${t('thDate')}</th></tr>${e.lines.map((l) => `<tr><td>${l.accountNumber}</td><td class="num">${nok(l.amount)}</td><td>${esc(l.description)}</td><td>${l.financialDate}</td></tr>`).join('')}</table></div>` : '') + `<p class="muted">${esc(e.caution)}</p>`).join('');
      const acc = m.finding.accountNumber ? ` (${t('kAcc')} ${m.finding.accountNumber})` : '';
      return `<details><summary><span class="tag ${sev[1]}">${sev[0]}</span> ${esc(SECTION[m.section]?.[lang] || m.section)}${acc} – ${nok(Math.abs(m.finding.value))}</summary><p>${esc(m.explanation)}</p><p><strong>${t('causes')}</strong></p><ul>${m.likelyCauses.map((c) => `<li>${esc(c)}</li>`).join('')}</ul><p><strong>${t('check')}</strong></p><ul>${m.diagnostics.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>${entries}</details>`;
    }).join('');

    el('forecast').innerHTML = `<tr><th>${t('fcWeek')}</th><th class="num">${t('fcIn')}</th><th class="num">${t('fcOut')}</th><th class="num">${t('fcFixed')}</th><th class="num">${t('fcBal')}</th></tr>` +
      f.weeks.map((w) => `<tr><td>${w.weekStart}</td><td class="num">${nok(w.inflowsAR)}</td><td class="num">${nok(w.outflowsAP)}</td><td class="num">${nok(w.outflowsFixed)}</td><td class="num ${w.closing < 0 ? 'red' : ''}">${nok(w.closing)}</td></tr>`).join('');
    const assume = f.assumptions.map((x) => { if (lang !== 'nb') return x; for (const [re, fn] of ASSUME_NB) { const m = re.exec(x); if (m) return fn(m); } return x; });
    el('assumptions').querySelector('ul').innerHTML = assume.map((x) => `<li>${esc(x)}</li>`).join('') + `<li>${t('fcExtra')}</li>`;

    const dr = d.reminders.drafts[0];
    if (dr) el('reminder').innerHTML = `<p><strong>${esc(dr.customer)}</strong>${dr.source === 'ai-generate' ? '' : ` <span class="muted">${t('remTemplate')}</span>`} · ${t('remLine')} ${nok(dr.netOverdue)} · <span class="tag ${STEP[dr.step].cls}">${STEP[dr.step][lang]}</span></p><pre>${esc(dr.text)}</pre>`;
  }
  render();
})();
</script>
</body>
</html>
